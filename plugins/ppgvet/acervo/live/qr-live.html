<!doctype html><meta charset="utf-8">
<!-- Overlay de QR da live, 1920x1080 transparente. Medidas da QR CERTIFICADO.png / QR CRONOGRAMA.png do Drive. ?qr=<png>&texto=<legenda> -->
<style>
@font-face{font-family:M;src:url(../fontes/montserrat-variavel.ttf) format('truetype');font-weight:100 900}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.card{position:absolute;left:1491px;top:722px;width:243px;height:245px;background:#fff;box-shadow:10px 10px 18px -5px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.card img{width:221px;height:221px}
#t{position:absolute;left:1437px;width:350px;top:968px;text-align:center;font-family:M;font-weight:800;font-size:21px;line-height:28px;color:#201E1E}
</style>
<div class="card"><img id="q"></div>
<div id="t"></div>
<script>
const p=new URLSearchParams(location.search); q.src=p.get('qr'); t.textContent=p.get('texto');
let fs=21; while(t.offsetTop+t.offsetHeight>1072&&fs>14){fs-=.5;t.style.fontSize=fs+'px';t.style.lineHeight=fs*1.33+'px'}
</script>

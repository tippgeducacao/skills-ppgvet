<!-- KV de pós (feed 4:5, anúncio): foto real em cima, gancho em peso misto, rótulo na cor da pós, bloco da pós e logo -->
<style>
.kv .foto{left:0;top:0;width:100%;height:60%}
.kv .logo{position:absolute;left:50%;transform:translateX(-50%);top:64px;width:150px}
.kv .miolo{position:absolute;left:var(--lado);right:var(--lado);top:calc(60% - 30px);bottom:var(--baixo);display:flex;flex-direction:column}
.kv .titulo{--t:84px;margin-top:40px;max-width:900px}
.kv .rodape{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.kv .rodape .logo{position:static;transform:none;width:170px}
</style>
<div class="peca kv ${tom}">
  <div class="foto" data-sangra><img alt="foto" src="${foto}" style="object-position:${foco}"><div class="veu-topo"></div></div>
  <img class="logo" alt="logo-sobre-foto" src="${logo_branco}">
  <div class="miolo">
    <div><span class="rotulo faixa-pos" data-caixa>${rotulo}</span></div>
    <h1 class="titulo">${titulo}</h1>
    <div class="rodape">${lockup}</div>
  </div>
</div>

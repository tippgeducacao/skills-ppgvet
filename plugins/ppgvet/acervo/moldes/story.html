<!-- Story ou anúncio 9:16: aviso de aula ou evento. Foto real de fundo, data em destaque na cor da pós, tudo dentro da área livre -->
<style>
.story .foto{inset:0}
.story .veu{--veu-de:22%;--veu-ate:62%}
.story-anuncio .veu{--veu-de:4%;--veu-ate:34%}
.story .area{position:absolute;left:var(--lado);right:var(--lado);top:var(--cima);bottom:var(--baixo);display:flex;flex-direction:column;color:#FFFFFF}
.story .logo{width:190px;align-self:center}
.story .bloco{margin-top:auto}
.story .data{display:inline-block;background:var(--pos);color:var(--sobre-pos);padding:20px 30px 14px;font-size:116px;font-weight:900;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
.story .titulo{--t:92px;margin:40px 0 24px}
.story .apoio{--a:40px}
.story .cta{margin-top:48px}
</style>
<div class="peca story escuro ${formato}">
  <div class="foto" data-sangra><img alt="foto" src="${foto}" style="object-position:${foco}"><div class="veu"></div><div class="veu-topo"></div></div>
  <div class="area">
    <img class="logo" alt="logo-sobre-foto" src="${logo_branco}">
    <div class="bloco">
      <div class="rotulo">${rotulo}</div>
      <div class="data" data-caixa style="margin-top:22px">${dia} ${mes}</div>
      <h1 class="titulo">${titulo}</h1>
      <p class="apoio">${apoio}</p>
      ${cta}
    </div>
  </div>
</div>
